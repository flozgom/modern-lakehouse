[project]
name = "lakehouse"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.0",
    "dagster-dlt",
    "dagster-duckdb",
    "duckdb",
    "dlt[filesystem,parquet]",
    "pandas",
    "s3fs",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "lakehouse"
registry_modules = [
    "lakehouse.components.*",
]



lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      extensions:
        - ducklake
        - postgres
        - httpfs
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT') }}"
          url_style: path
          use_ssl: false
      attach:
        - path: "ducklake:postgres:dbname={{ env_var('POSTGRES_DB') }} user={{ env_var('POSTGRES_USER') }} password={{ env_var('POSTGRES_PASSWORD') }} host={{ env_var('POSTGRES_HOST') }} port={{ env_var('POSTGRES_PORT') }}"
          alias: ducklake
          options:
            data_path: "s3://{{ env_var('MINIO_BUCKET') }}/ducklake"
        - path: "postgresql://{{ env_var('POSTGRES_USER') }}:{{ env_var('POSTGRES_PASSWORD') }}@{{ env_var('POSTGRES_HOST') }}:{{ env_var('POSTGRES_PORT') }}/{{ env_var('POSTGRES_DB') }}"
          type: postgres
          alias: pg

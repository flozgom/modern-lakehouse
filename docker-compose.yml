services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ducklake-net

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing myminio/$${MINIO_BUCKET} &&
      echo 'Bucket created successfully'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ducklake}
    networks:
      - ducklake-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ducklake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ducklake}
      POSTGRES_DB: ${POSTGRES_DB:-ducklake}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-silver.sql:/docker-entrypoint-initdb.d/init-silver.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ducklake}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ducklake-net

  duckdb:
    build:
      context: docker/duckdb
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ducklake}
      POSTGRES_USER: ${POSTGRES_USER:-ducklake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ducklake}
      POSTGRES_DB: ${POSTGRES_DB:-ducklake}
    volumes:
      - ./lakehouse/src/lakehouse/defs/loading/upsert_ohlc_silver.sql:/opt/duckdb/upsert_ohlc_silver.sql:ro
    stdin_open: true
    tty: true
    profiles:
      - cli
    networks:
      - ducklake-net

volumes:
  minio-data:
  postgres-data:

networks:
  ducklake-net:
